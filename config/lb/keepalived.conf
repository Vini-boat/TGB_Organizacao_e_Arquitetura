# keepalived do lb1 e do lb2 (um arquivo só, na pasta compartilhada).
# Linhas com "@nome" só valem no contêiner cujo hostname (uname -n) é "nome".
global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_1 {
    interface eth0
    virtual_router_id 51
    advert_int 1
@lb1 state MASTER
@lb1 priority 150
@lb1 unicast_src_ip 10.10.10.11
@lb2 state BACKUP
@lb2 priority 100
@lb2 unicast_src_ip 10.10.10.12
    unicast_peer {
@lb1     10.10.10.12
@lb2     10.10.10.11
    }
    virtual_ipaddress {
        10.10.10.10/24 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
