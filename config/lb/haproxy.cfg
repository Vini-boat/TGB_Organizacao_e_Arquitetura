global
    log /dev/log local0
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend web
    bind *:80
    default_backend apps

backend apps
    balance roundrobin
    option httpchk GET /health
    default-server inter 2s fall 3 rise 2
    server app1 10.10.10.21:8080 check
    server app2 10.10.10.22:8080 check

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
