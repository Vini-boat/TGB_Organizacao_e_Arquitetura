<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hostname</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      background: var(--card);
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      text-align: center;
    }
    .label {
      margin: 0 0 .5rem;
      color: var(--muted);
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .1em;
    }
    .hostname {
      margin: 0;
      color: var(--accent);
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 2.2rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">Servidor</p>
    <h1 class="hostname">{{ hostname }}</h1>
  </main>
</body>
</html>
