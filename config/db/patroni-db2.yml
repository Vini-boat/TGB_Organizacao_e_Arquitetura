# Patroni do db2 (/etc/patroni/16-main.yml -> este arquivo)
scope: tgb
name: db2

restapi:
  listen: 0.0.0.0:8008
  connect_address: 10.10.10.32:8008

etcd3:
  hosts: 10.10.10.31:2379,10.10.10.32:2379,10.10.10.11:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    postgresql:
      use_pg_rewind: true
  initdb:
    - encoding: UTF8

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.10.10.32:5432
  data_dir: /var/lib/postgresql/16/tgb
  bin_dir: /usr/lib/postgresql/16/bin
  pg_hba:
    - local all all peer
    - host all all 127.0.0.1/32 scram-sha-256
    - host replication replicador 10.10.10.0/24 scram-sha-256
    - host all all 10.10.10.0/24 scram-sha-256
  authentication:
    superuser:
      username: postgres
      password: tgb-super
    replication:
      username: replicador
      password: tgb-repl
